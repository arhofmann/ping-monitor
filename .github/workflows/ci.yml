name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # On Ubuntu and macOS this only shows that everything compiles and that the core behaves the same there;
        # the user interface is not started.
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build PingMonitor.slnx --configuration Release

      - name: Test
        run: dotnet run --project tests/PingMonitor.Core.Tests --configuration Release --no-build
